# Gate run right after ingestion. A failing check blocks every downstream Dagster asset.
checks for COMMENTS:
  - row_count > 0
  - freshness(_LOADED_AT) < 2d
  - missing_count(_FILE) = 0

  # duplicates inside the most recent load file (should be zero; overlap between runs is handled by dbt)
  - duplicates_in_last_file = 0:
      duplicates_in_last_file query: |
        SELECT COUNT(*) - COUNT(DISTINCT payload:objectID::string)
        FROM COMMENTS
        WHERE _FILE = (SELECT _FILE FROM COMMENTS ORDER BY _LOADED_AT DESC LIMIT 1)

  # null rate of a key attribute in the last day (percent)
  - null_author_pct < 5:
      null_author_pct query: |
        SELECT COALESCE(100 * AVG(IFF(payload:author::string IS NULL, 1, 0)), 0)
        FROM COMMENTS
        WHERE _LOADED_AT >= DATEADD('day', -1, CURRENT_TIMESTAMP())

  # volume anomaly: comments PER HOUR of data in the latest load vs average of earlier loads (1 = same)
  - volume_ratio between 0.2 and 5:
      volume_ratio query: |
        WITH files AS (
          SELECT _FILE AS fname, COUNT(*) AS c, MAX(_LOADED_AT) AS t,
                 GREATEST((MAX(payload:created_at_i::number) - MIN(payload:created_at_i::number)) / 3600.0, 1) AS span_h
          FROM COMMENTS GROUP BY 1
        ),
        rates AS (SELECT fname, t, c / span_h AS per_hour FROM files WHERE c >= 100),
        last AS (SELECT fname, per_hour FROM rates ORDER BY t DESC LIMIT 1),
        prev AS (SELECT AVG(per_hour) AS a, COUNT(*) AS n FROM rates WHERE fname <> (SELECT fname FROM last))
        SELECT COALESCE(MAX(IFF(prev.n < 2, 1, last.per_hour / NULLIF(prev.a, 0))), 1) FROM last, prev

checks for STORIES:
  - row_count > 0
  - freshness(_LOADED_AT) < 2d
